[package]
name = "deskpet-assetpipe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cuts a subject out of a photo. Spawned per import; never linked into the app."

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ort = "=2.0.0-rc.13"
sha2 = "0.10"
ureq = "2"
