[package]
name = "deskpet"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "A desktop pet that belongs on your desktop."

[lib]
name = "deskpet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
axum = "0.8"
# png+webp decode pack sprites; jpeg is for imported photos, which is what
# people actually have. Features are explicit rather than default because the
# full default set drags in a dozen formats nobody here will ever open.
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel", "NSApplication", "NSResponder", "NSView"] }
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# NOTE: [profile.*] must live in the workspace root Cargo.toml. Cargo ignores
# profiles declared in a non-root member and only says so in a warning, so a
# release profile put back here would silently stop applying.
