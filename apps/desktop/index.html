<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' asset: data: blob:" />
    <style>
      /* The window is transparent; anything opaque here shows up as a box
         around the pet. Nothing in this document may set a background. */
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
                   user-select: none; -webkit-user-select: none; cursor: default; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
