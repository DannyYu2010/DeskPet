# Workspace root.
#
# `crates/assetpipe` must build into the same `target/` as the app so the app
# can find the binary next to its own executable. That is the whole reason this
# file exists — without it the two crates have separate target directories and
# locating the pipeline binary becomes guesswork.
#
# Note this moves build output from apps/desktop/src-tauri/target/ to ./target/.

[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/assetpipe"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
